<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solitaire Nova</title>
<meta name="description" content="Solitaire Nova — classic Klondike solitaire for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#101B27; --panel:#123F39; --gold:#D6B574; --text:#F7F4EC; --muted:#B9C7C1; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(circle at 50% 30%, #17483F, var(--bg) 70%); color:var(--text);
         font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; padding:32px 16px; text-align:center; }
  img { width:140px; height:140px; border-radius:28px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  h1 { color:var(--gold); font-family:Georgia,serif; letter-spacing:.08em; margin:24px 0 8px; }
  p { color:var(--muted); }
  a { color:var(--gold); }
  .links { margin-top:28px; display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Solitaire Nova icon">
  <h1>SOLITAIRE NOVA</h1>
  <p>Classic Klondike solitaire with daily challenges, themes and 16 languages. Works fully offline. No gambling, no cash prizes.</p>
  <p lang="ro">Solitaire Klondike clasic, cu provocări zilnice, teme și 16 limbi. Funcționează complet offline.</p>
  <div class="links">
    <a href="privacy/">Privacy Policy / Confidențialitate</a>
    <a href="mailto:animatix95@gmail.com">Contact</a>
  </div>
</main>
</body>
</html>
